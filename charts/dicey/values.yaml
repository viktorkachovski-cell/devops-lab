replicaCount: 2

image:
  repository: ghcr.io/YOUR_GH_USER/devops-lab/dicey
  tag: latest
  pullPolicy: IfNotPresent

failRate: "0"

service:
  port: 80

ingress:
  enabled: true
  host: dicey.localhost

serviceMonitor:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
